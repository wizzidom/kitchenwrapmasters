# =====================================================
# KITCHEN WRAP MASTERS — Netlify Configuration
# =====================================================

[build]
  # No build step needed — this is a static site
  publish = "."
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Trailing-slash canonicalisation (prevents duplicate content)
[[redirects]]
  from   = "/shop"
  to     = "/shop/"
  status = 301

[[redirects]]
  from   = "/cart"
  to     = "/cart/"
  status = 301

[[redirects]]
  from   = "/checkout"
  to     = "/checkout/"
  status = 301

[[redirects]]
  from   = "/order-confirmed"
  to     = "/order-confirmed/"
  status = 301

# ---------------------------------------------------------------------------
# Security headers (applied to all pages)
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively, HTML never
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Functions config
# ---------------------------------------------------------------------------

[functions]
  # Node 18 supports the native fetch API (no node-fetch needed)
  node_bundler = "esbuild"

  [functions.payfast-notify]
    # PayFast sends POST requests — allow larger body for cart data
    # (default is 6MB which is fine, but explicit is better)
    included_files = []
